<!DOCTYPE html>
<html lang="cs">
<head>
    <title>ZBOŘENO CZ</title>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta property="og:description" content="Interaktivní 3D mapa českých památek" />
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.css' />
    <link rel='stylesheet' href='style.css' />
    <script src='https://unpkg.com/maplibre-gl@5.17.0/dist/maplibre-gl.js'></script>
</head>
<body>
<script type="importmap">
    {
        "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
    }
</script>

<div id="map"></div>

<button id="mobileSidebarToggle" class="mobile-sidebar-toggle" aria-expanded="false" aria-controls="sidebar">
    Seznam památek
</button>

<!-- Boční panel se seznamem památek -->
<div id="sidebar" class="sidebar">
    <div class="sidebar-header">
        <h2>České Památky</h2>
        <p class="subtitle">3D pohled na památky</p>
    </div>
    
    <div class="map-style-selector">
        <label for="mapStyle">Styl mapy:</label>
        <select id="mapStyle">
            <option value="tourist" selected>Turistická</option>
            <option value="satellite">Satelitní</option>
        </select>
    </div>
    
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Hledat památku...">
    </div>
    
    <div class="monuments-container">
        <div id="monumentsList" class="monuments-list">
            <!-- Seznam památek se naplní automaticky -->
            <div class="loading">Načítání památek...</div>
        </div>
    </div>
    
    <div class="sidebar-footer">
        <button id="resetView" class="btn-reset">Reset pohledu</button>
        <div id="status" class="status"></div>
    </div>
</div>

<!-- Informační panel -->
<div class="info-panel">
    <div class="info-content">
        <strong>Ovládání:</strong>
        <ul>
            <li>Tažení myší = pohyb po mapě</li>
            <li>Kliknutí = detail památky</li>
            <li>Kolečko = přiblížení/oddálení</li>
            <li>Ctrl + tažení = natočení kamery</li>
        </ul>
    </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
